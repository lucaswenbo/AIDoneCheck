name: AIDoneCheck 可复现演示
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  demo:
    name: 演示 — ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [healthy, no-tests, test-failure, pageerror, resource-overflow, unsafe-path]
    env:
      DEMO_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: 启动本地 Browser fixture（不访问生产网站）
        if: matrix.scenario == 'pageerror' || matrix.scenario == 'resource-overflow'
        run: |
          node scripts/fixture-server.mjs 0 "$RUNNER_TEMP/aidonecheck-demo-url" > "$RUNNER_TEMP/aidonecheck-demo-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aidonecheck-demo-pid"
      - name: 创建独立 Git 项目和真实故障
        run: node scripts/demo-fixture.mjs
      - name: 安装演示项目的 TypeScript（Action 自身无需 npm ci）
        working-directory: .demo
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 运行当前仓库的真实 AIDoneCheck Action
        id: verify
        continue-on-error: true
        uses: ./
        with:
          working-directory: .demo
          base: main
          language: zh
      - name: 断言实际结论、失败原因和 Evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ steps.verify.outputs.evidence_dir }}
          EVIDENCE_NAME: ${{ steps.verify.outputs.evidence_name }}
          ARTIFACT_ID: ${{ steps.verify.outputs.artifact_id }}
          VERDICT: ${{ steps.verify.outputs.verdict }}
          ACTION_OUTCOME: ${{ steps.verify.outcome }}
        run: node scripts/assert-demo.mjs
      - name: 从 GitHub 下载本场景 Artifact
        if: always() && steps.verify.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/demo-downloaded
          merge-multiple: true
      - name: 核对下载文件与原始 Evidence 完全一致
        if: always() && steps.verify.outputs.artifact_id != ''
        env:
          EVIDENCE_DIR: ${{ steps.verify.outputs.evidence_dir }}
          DOWNLOADED: ${{ runner.temp }}/demo-downloaded
        run: node scripts/verify-demo-download.mjs
      - name: 停止本地 fixture server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/aidonecheck-demo-pid"; then
            kill "$(cat "$RUNNER_TEMP/aidonecheck-demo-pid")" || true
          fi
