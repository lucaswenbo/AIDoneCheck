name: Browser smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Install isolated pinned Chromium
        run: |
          runtime="$RUNNER_TEMP/aidonecheck-browser-smoke"
          mkdir -p "$runtime"
          npm install --prefix "$runtime" --ignore-scripts --package-lock=false --no-audit --no-fund playwright@1.63.0
          node "$runtime/node_modules/playwright/cli.js" install --with-deps chromium
          echo "AIDONECHECK_PLAYWRIGHT_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Real local fixture Browser smoke
        env:
          AIDONECHECK_SMOKE_EVIDENCE: ${{ runner.temp }}/browser-smoke-evidence
        run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-smoke-evidence
          if-no-files-found: error
          retention-days: 7
