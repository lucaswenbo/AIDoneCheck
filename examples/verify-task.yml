# Copy to your project's .github/workflows/verify-task.yml.
name: AIDoneCheck verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Verify and preserve evidence
        id: verify
        uses: lucaswenbo/AIDoneCheck@v1.0.4
        with:
          fail-on-warn: 'false'
          language: en # Use zh for Simplified Chinese.
